
name: JW Street Kobra Go Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Marlin
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Kobra Go
        run: |
          pio run -e HC32F460C_kobra_go

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: JW_Street_KobraGo_BIN
          path: .pio/build/HC32F460C_kobra_go/*.bin
          if-no-files-found: error
